<div class="not-found-page">
  <div class="container">
    <div class="error-content animated fadeIn">
      <div class="error-illustration">
        <img src="/images/placeholder/error-404.png" alt="404"
          (error)="$any($event.target).src='/images/logo/banglabazar-books-logo.png'">
        <div class="error-code">404</div>
      </div>
      <h1>দুঃখিত, পেজটি পাওয়া যায়নি!</h1>
      <p>আপনি যে লিংকটি খুঁজছেন সেটি হয়তো পরিবর্তন করা হয়েছে অথবা মুছে ফেলা হয়েছে।</p>

      <div class="actions">
        <button mat-raised-button color="primary" routerLink="/">হোম পেজে ফিরে যান</button>
        <button mat-stroked-button routerLink="/product-list">সকল বই দেখুন</button>
      </div>
    </div>
  </div>
</div>
