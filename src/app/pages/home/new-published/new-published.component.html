@if (products().length > 0) {
  <div class="container">
    <div class="main-title">
      <h2>{{ "ln.NewlyPublished" | translate }}</h2>
    </div>
    <div class="card-container">
      @if (isLoadingNewPublicationBook()) {
        @for (data of [1,2,3,4,5,6]; track data) {
          <app-card-one-loader></app-card-one-loader>
        }
      } @else {
        @for (data of products(); track data._id || $index) {
          <app-product-card-one [data]="data"></app-product-card-one>
        }
      }
    </div>
    <div class="see-more-btn">
      <div class="read-more">
        <a routerLink="/product-list" [queryParams]="{tags: 'new-published' }">{{ "ln.SeeMore" | translate }}</a>
      </div>
    </div>
  </div>
}
