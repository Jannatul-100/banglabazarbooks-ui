<div class="articles-contents">
  <div class="container">
    <div class="title-area">
      <h2>{{ "ln.OurArticle" | translate }}</h2>
    </div>
    <div class="articles-contents-main carousel-article">
      @if (isBrowser) {
        <swiper-container #swiperEl init="false" class="mySwiper">
          @if (isLoadingBlog()) {
            @for (data of [1,2,3,4,5,6]; track data) {
              <swiper-slide>
                <app-blog-loader></app-blog-loader>
              </swiper-slide>
            }
          } @else {
            @for (data of blogs(); track data._id || $index) {
              <swiper-slide>
                <app-blog-card-one [data]="data"></app-blog-card-one>
              </swiper-slide>
            }
          }
        </swiper-container>
      }
    </div>
  </div>
</div><!---END ARTICALES--->
