<!---user-reviews-->
@if (allReviews().length > 0) {
  <div class="user-reviews">
    <div class="container">
      <div class="title-area">
        <h2>{{ "ln.ReaderRemarks" | translate }}</h2>
      </div>
      <div class="user-reviews-main carousel">
        @if (isBrowser) {
          <swiper-container #swiperEl init="false" class="mySwiper">
            @for (data of allReviews(); track data._id || $index) {
              <swiper-slide>
                <app-user-reviews-card-one [data]="data"></app-user-reviews-card-one>
              </swiper-slide>
            }
          </swiper-container>
        }
      </div>
    </div>
  </div>
}<!---END USER REVIEWS-->
