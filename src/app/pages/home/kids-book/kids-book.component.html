@if (products().length > 0) {
  <div class="kids-book">
    <div class="container">
      <div class="kids-book-contents">
        <div class="title-area">
          <h2>{{ "ln.KidsBook" | translate }}</h2>
        </div>
        <div class="kids-book-main kid-carousel carousel">
          @if (isBrowser) {
            <swiper-container #swiperEl init="false" class="mySwiper">
              @if (isLoadingKidsBook()) {
                @for (data of [1,2,3,4,5,6]; track data) {
                  <swiper-slide>
                    <app-card-one-loader></app-card-one-loader>
                  </swiper-slide>
                }
              } @else {
                @for (data of products(); track data._id || $index) {
                  <swiper-slide>
                    <app-product-card-one [data]="data"></app-product-card-one>
                  </swiper-slide>
                }
              }
            </swiper-container>
          }
        </div>

        @if (data()) {
          <div class="see-more-btn">
            <div class="read-more" routerLink="/product-list"
              [queryParams]="{categories: data()[0]?.slug, categoryId: data()[0]?._id }">
              <span>{{ "ln.SeeMore" | translate }}</span>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}
