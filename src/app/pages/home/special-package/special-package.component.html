<!---special-packages-->
@if (specialPackages().length > 0) {
  <div class="special-packages">
    <div class="container">
      <!---title-area-->
      <div class="title-area">
        <h2>{{ "ln.OurSpecial" | translate }}</h2>
      </div>
      <div class="special-packages-main carousel">
        @if (isBrowser) {
          <swiper-container #swiperEl init="false" class="mySwiper">
            @if (isLoadingSpecialPackage()) {
              @for (data of [1,2,3,4,5,6]; track data) {
                <swiper-slide>
                  <app-special-package-loader></app-special-package-loader>
                </swiper-slide>
              }
            } @else {
              @for (data of specialPackages(); track data._id || $index) {
                <swiper-slide>
                  <app-special-package-card-one [data]="data"></app-special-package-card-one>
                </swiper-slide>
              }
            }
          </swiper-container>
        }
      </div>
    </div>
  </div>
}<!---END SPECIAL PACKAGES--->
