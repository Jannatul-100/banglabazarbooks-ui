<div class="kids-book" *ngIf="products() && products().length">
  <div class="container">
    <div class="kids-book-contents">
      <div class="title-area">
        <h2 [class.english-font]="language() === 'en'">{{ "ln.RelatedBooks" | translate }}</h2>
      </div>
      <div class="kids-book-main carousel">
        @if (isBrowser) {
          <swiper-container #swiperEl init="false" class="mySwiper">
            @for (data of products(); track data._id || $index) {
              <swiper-slide>
                <app-product-card-two [data]="data"></app-product-card-two>
              </swiper-slide>
            }
          </swiper-container>
        }
      </div>
      <div class="see-more-btn">
        <div class="read-more">
          <a routerLink="/product-list">{{ "ln.SeeMore" | translate }}</a>
        </div>
      </div>
    </div>
  </div>
</div>
