<div class="complete-reg-page">
  <div class="container">
    <div class="reg-card animated fadeInUp">
      <div class="card-header">
        <div class="header-icon"><i class="fa fa-user-check"></i></div>
        <h1>নিবন্ধন সম্পন্ন করুন</h1>
        <p>আপনার প্রোফাইলটি আপডেট করে বাংলাবাজার বুকসের অফারগুলো উপভোগ করুন।</p>
      </div>

      <form [formGroup]="regForm" (ngSubmit)="onSubmit()" class="reg-form">
        <mat-form-field appearance="outline">
          <mat-label>পুরো নাম</mat-label>
          <input matInput formControlName="name" placeholder="আপনার নাম লিখুন">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>মোবাইল নাম্বার</mat-label>
          <input matInput formControlName="phoneNo" placeholder="০১৭XXXXXXXX" readonly>
          <mat-icon matSuffix>phone</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>ইমেইল (ঐচ্ছিক)</mat-label>
          <input matInput formControlName="email" placeholder="example@mail.com">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>ঠিকানা (ঐচ্ছিক)</mat-label>
          <textarea matInput formControlName="addressLine" rows="2" placeholder="বিস্তারিত ঠিকানা লিখুন"></textarea>
          <mat-icon matSuffix>location_on</mat-icon>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="isLoading()" class="btn-submit">
          {{ isLoading() ? 'প্রসেসিং হচ্ছে...' : 'নিবন্ধন সম্পন্ন করুন' }}
          <i class="fa fa-arrow-right" *ngIf="!isLoading()"></i>
        </button>
      </form>
      
      <div class="card-footer">
        <p>ব্যক্তিগত তথ্য সুরক্ষার জন্য আমাদের <a routerLink="/pages/privacy-policy">প্রাইভেসি পলিসি</a> পড়ুন।</p>
      </div>
    </div>
  </div>
</div>
