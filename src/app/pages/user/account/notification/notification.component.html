<div class="section">
  <div class="section-main">
    <div class="section-top">
      <h3>My Notifications</h3>
    </div>
    <div class="wishlist-area">
      <div class="wishlist-product">
        <div class="wishlist-main">
          <div class="produt-area">
            @if (isLoading()) {
              <div class="loader-container" style="display: flex; justify-content: center; padding: 20px; width: 100%;">
                <div class="spinner" style="border: 4px solid #f3f3f3; border-top: 4px solid #CA2128; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;"></div>
              </div>
            } @else {
              @for (data of notifications(); track data._id) {
                <div class="card" [class]="data?.isReadNoti === true ? 'read' : 'unread'"
                  [attr.data-label]="data?.createdAt | date:'short'">
                  <div class="menu">
                    <div class="notification-read-unread">
                      <button (click)="updateNotification(data?._id, true)" [class.read-notification]="data?.isReadNoti == true">
                        <span>Read</span>
                      </button>
                      <button (click)="updateNotification(data?._id, false)" [class.unread-notification]="data?.isReadNoti == false">
                        <span>Unread</span>
                      </button>
                    </div>
                  </div>
                  <div class="card__container">
                    <div class="image">
                      <img [src]="data.image || 'assets/images/placeholder/notification.png'" alt="">
                    </div>
                    <div class="content">
                      <h1 class="card__header">
                        {{data?.name}}
                      </h1>
                      <div class="card__body" [innerHTML]="data?.description | safeHtml">
                      </div>
                    </div>
                  </div>
                </div>
              } @empty {
                <div class="empty-state" style="text-align: center; padding: 40px 0; width: 100%;">
                  <h3>Currently no notifications</h3>
                </div>
              }
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
