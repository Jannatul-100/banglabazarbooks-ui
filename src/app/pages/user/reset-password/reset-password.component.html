<div class="reset-page">
  <div class="container">
    <div class="reset-card animated fadeInDown">
      <div class="card-header">
        <div class="logo">
          <img src="/images/logo/banglabazar-books-logo.png" alt="বাংলাবাজার বুকস">
        </div>
        <h1>পাসওয়ার্ড রিসেট</h1>
        <p>আপনার একাউন্টের পাসওয়ার্ড নতুন করে সেট করুন।</p>
      </div>

      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="reset-form">
        <mat-form-field appearance="outline">
          <mat-label>ইউজারনেম / ইমেইল / ফোন</mat-label>
          <input matInput formControlName="username" placeholder="আপনার তথ্য দিন" [readonly]="isOtpSent()">
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        @if (isOtpSent()) {
          <div class="otp-section animated fadeIn">
            <mat-form-field appearance="outline">
              <mat-label>ওটিপি কোড (OTP)</mat-label>
              <input matInput formControlName="otp" placeholder="৬ ডিজিটের কোড">
              <span matSuffix class="otp-timer" *ngIf="countdown() > 0">{{ countdown() }}s</span>
            </mat-form-field>
            
            <mat-form-field appearance="outline">
              <mat-label>নতুন পাসওয়ার্ড</mat-label>
              <input matInput [type]="isPasswordVisible() ? 'text' : 'password'" formControlName="password" placeholder="******">
              <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button">
                <mat-icon>{{ isPasswordVisible() ? 'visibility' : 'visibility_off' }}</mat-icon>
              </button>
            </mat-form-field>

            @if (countdown() === 0) {
              <button type="button" class="resend-btn" (click)="onSendOtp()">পুনরায় ওটিপি পাঠান</button>
            }
          </div>
        }

        <button mat-raised-button color="primary" type="submit" [disabled]="isLoading()" class="btn-submit">
          @if (isLoading()) {
            প্রসেস হচ্ছে...
          } @else {
            {{ isOtpSent() ? 'পাসওয়ার্ড পরিবর্তন করুন' : 'ওটিপি পাঠান' }}
          }
        </button>
      </form>

      <div class="card-footer">
        <p><a routerLink="/login">লগইন পেজে ফিরে যান</a></p>
      </div>
    </div>
  </div>
</div>
