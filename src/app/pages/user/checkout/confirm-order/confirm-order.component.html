@if (isOpen()) {
  <div class="confirm-overlay animated fadeIn">
    <div class="confirm-modal scaleIn">
      <div class="success-icon">
        <i class="fa fa-check-circle"></i>
      </div>
      
      <div class="confirm-content">
        <h2>অর্ডারটি সফলভাবে সম্পন্ন হয়েছে!</h2>
        <p>আপনার অর্ডার আইডি: <span>#{{ orderId() }}</span></p>
        <p class="sub-text">অর্ডার তথ্য এবং পরবর্তী আপডেট আপনার মোবাইল নাম্বারে শীঘ্রই পাঠানো হবে। ইনশাআল্লাহ!</p>
      </div>

      <div class="confirm-actions">
        <button class="btn-track" [routerLink]="['/user/account/order-track', orderId()]" (click)="onHidePop()">অর্ডার ট্র্যাক করুন</button>
        <button class="btn-home" routerLink="/" (click)="onHidePop()">হোম পেজে ফিরে যান</button>
      </div>
    </div>
  </div>
}
