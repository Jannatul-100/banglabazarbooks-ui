<div class="card">
  <div class="product-image">
    <ngx-skeleton-loader count="1" [theme]="{
      width: '100%',
      height: '100%',
      'border-radius': '0',
      'background-color': '#f8f4ea',
      border: 'none'
    }">
    </ngx-skeleton-loader>
  </div>

  <div class="text-aria">
    <ngx-skeleton-loader count="1" [theme]="{
      width: '55%',
      height: '12px',
      'border-radius': '4px',
      'background-color': '#ebe3d2',
      border: 'none',
      margin: '0 0 8px'
    }">
    </ngx-skeleton-loader>

    <ngx-skeleton-loader count="1" [theme]="{
      width: '90%',
      height: '15px',
      'border-radius': '4px',
      'background-color': '#ebe3d2',
      border: 'none',
      margin: '0 0 6px'
    }">
    </ngx-skeleton-loader>

    <ngx-skeleton-loader count="1" [theme]="{
      width: '75%',
      height: '15px',
      'border-radius': '4px',
      'background-color': '#f3ead8',
      border: 'none'
    }">
    </ngx-skeleton-loader>
  </div>

  <div class="price-aria">
    <ngx-skeleton-loader count="1" [theme]="{
      width: '100%',
      height: '36px',
      'border-radius': '8px',
      'background-color': '#f8f4ea',
      border: '1px solid rgba(245, 197, 24, 0.4)'
    }">
    </ngx-skeleton-loader>
  </div>
</div>
