<div class="pdf-height" style="height: 100%; display: flex; flex-direction: column;">
  <div class="offer-cross-area" style="text-align: right; padding: 10px; background: #f5f5f5; border-bottom: 1px solid #ddd;">
    <span (click)="onClose()" style="color: #333; cursor: pointer; font-size: 24px; padding: 0 10px;"><i class="fa fa-xmark"></i></span>
  </div>

  <div class="pdf-height1" style="flex-grow: 1; position: relative; background: #fff; overflow-y: auto; max-height: 650px;">
    <div class="loading1" *ngIf="isLoading" style="display: grid; place-items: center; height: 300px;">
      <div style="text-align: center; color: #666;">
        <i class="fa fa-spinner fa-spin" style="font-size: 30px; margin-bottom: 10px;"></i>
        <p style="font-size: 16px;">পিডিএফ লোড হচ্ছে...</p>
      </div>
    </div>

    <div id="pdfContainer" #pdfContainer class="pdf-container" style="display: flex; flex-direction: column; gap: 15px; align-items: center; padding: 10px;">
    </div>
    
    <div *ngIf="showNoPdfMessage" class="not-found" style="display: grid; place-items: center; height: 300px; color: #666; font-size: 18px;">
      <span>বইটির পিডিএফ পাওয়া যায়নি।</span>
    </div>
  </div>
</div>
